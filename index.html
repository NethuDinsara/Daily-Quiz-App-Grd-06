<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daily Practice Booster</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #1E293B;
      --muted: #64748B;
      --correct: #10B981;
      --incorrect: #EF4444;
      --sinhala-bg: #FEF3C7;
      --sinhala-text: #92400E;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 12px; 
      display: flex; 
      justify-content: center; 
    }
    
    .app-container { 
      width: 100%; 
      max-width: 480px; 
      background: var(--card); 
      border-radius: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.06); 
      padding: 18px; 
      min-height: 90vh; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
    }

    .header { 
      padding-bottom: 12px; 
      border-bottom: 2px solid #F1F5F9; 
      margin-bottom: 16px; 
    }
    
    .badge-row { 
      display: flex; 
      gap: 6px; 
      margin-bottom: 8px; 
    }
    
    .badge { 
      display: inline-block; 
      padding: 4px 12px; 
      border-radius: 16px; 
      font-size: 0.75rem; 
      font-weight: 700; 
      text-transform: uppercase; 
    }
    
    .subject-tag { background: var(--primary-light); color: var(--primary); }
    .target-tag { background: #DCFCE7; color: #166534; }
    
    .header h1 { 
      font-size: 1.15rem; 
      color: var(--text); 
      font-weight: 800; 
      line-height: 1.3;
    }

    /* Child-friendly quiz card */
    .quiz-card { 
      background: #F8FAFC; 
      border: 1.5px solid #E2E8F0; 
      border-radius: 16px; 
      padding: 14px; 
      margin-bottom: 14px; 
    }
    
    .q-number { 
      font-size: 0.72rem; 
      font-weight: 800; 
      color: var(--primary); 
      text-transform: uppercase; 
      margin-bottom: 4px; 
    }
    
    .q-text { 
      font-weight: 600; 
      font-size: 0.95rem; 
      margin-bottom: 12px; 
      line-height: 1.45; 
    }

    /* Large touch-friendly options */
    .option-btn { 
      width: 100%; 
      text-align: left; 
      background: #FFFFFF; 
      border: 1.5px solid #CBD5E1; 
      padding: 14px; 
      border-radius: 12px; 
      margin-bottom: 8px; 
      font-size: 0.92rem; 
      font-weight: 500; 
      cursor: pointer; 
      transition: all 0.15s ease; 
      outline: none; 
    }
    
    .option-btn:active { background: #F1F5F9; }
    
    .option-btn.selected { 
      border-color: var(--primary) !important; 
      background: var(--primary-light) !important; 
      color: var(--primary) !important; 
      font-weight: 700 !important; 
    }
    
    .text-input { 
      width: 100%; 
      padding: 14px; 
      border: 1.5px solid #CBD5E1; 
      border-radius: 12px; 
      font-size: 0.95rem; 
      outline: none; 
      background: #FFF;
    }
    
    .text-input:focus { border-color: var(--primary); }

    /* Single combined Action Button */
    .btn-submit-send { 
      width: 100%; 
      background: #25D366; 
      color: white; 
      border: none; 
      padding: 16px; 
      border-radius: 14px; 
      font-weight: 700; 
      font-size: 1.05rem; 
      cursor: pointer; 
      margin-top: 10px; 
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35); 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-resend { 
      width: 100%; 
      background: #25D366; 
      color: white; 
      border: none; 
      padding: 14px; 
      border-radius: 14px; 
      font-weight: 700; 
      font-size: 0.95rem; 
      cursor: pointer; 
      margin-top: 14px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3); 
    }

    .score-banner { 
      text-align: center; 
      padding: 12px 0 16px 0; 
      border-bottom: 2px dashed #E2E8F0; 
      margin-bottom: 16px; 
    }
    
    .score-badge { font-size: 2.8rem; font-weight: 800; color: var(--primary); }
    .target-met { font-size: 0.95rem; font-weight: 700; color: var(--correct); margin-top: 4px; }
    .target-missed { font-size: 0.95rem; font-weight: 700; color: #D97706; margin-top: 4px; }

    .review-card { 
      background: #FFFFFF; 
      border-left: 5px solid var(--primary); 
      padding: 12px 14px; 
      border-radius: 10px; 
      margin-bottom: 12px; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.04); 
      border-top: 1px solid #F1F5F9; 
      border-right: 1px solid #F1F5F9; 
      border-bottom: 1px solid #F1F5F9; 
    }
    
    .review-card.correct { border-left-color: var(--correct); }
    .review-card.incorrect { border-left-color: var(--incorrect); }
    
    .sinhala-review { 
      background: var(--sinhala-bg); 
      color: var(--sinhala-text); 
      padding: 8px 10px; 
      border-radius: 8px; 
      font-size: 0.84rem; 
      margin-top: 8px; 
      line-height: 1.45; 
    }
    
    .loading-msg {
      text-align: center;
      padding: 50px 20px;
      color: var(--muted);
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div>
    <div class="header">
      <div class="badge-row">
        <div class="badge subject-tag" id="subject-tag">SUBJECT</div>
        <div class="badge target-tag">Target: 65%+</div>
      </div>
      <h1 id="title-text">Daily Practice Booster</h1>
    </div>

    <!-- Quiz Screen -->
    <div id="screen-quiz">
      <div id="quiz-container">
        <div class="loading-msg">⏳ Loading your questions...</div>
      </div>
      <button class="btn-submit-send" id="submit-btn" type="button" style="display:none;">
        <span>📲</span> Done! Submit & Send to Tutor
      </button>
    </div>

    <!-- Results & Review Screen -->
    <div id="screen-results" style="display:none;">
      <div class="score-banner">
        <div style="font-size: 0.85rem; color: var(--muted); font-weight: 600;">Your Score Today</div>
        <div class="score-badge" id="score-text">0 / 20</div>
        <div id="target-feedback"></div>
      </div>

      <button class="btn-resend" id="whatsapp-btn-resend" type="button">
        <span>📲</span> Re-send Score via WhatsApp
      </button>

      <div style="margin: 20px 0 10px 0; font-weight: 700; font-size: 0.95rem; color: var(--muted);">Review & Study Tips:</div>
      <div id="review-container"></div>
    </div>
  </div>
</div>

<script>
  // Google Apps Script Web App Endpoint
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbRD74dpAEVZnL01OacoUmw8t0emDSp17ZGT_Q30b1GOTVX-RtZhc4IJS8jpLp03QhmQ/exec";
  var TARGET_PHONE = "94701543307";

  function getSubject() {
    var query = window.location.search.substring(1);
    if (!query) return 'science';

    var pairs = query.split('&');
    for (var i = 0; i < pairs.length; i++) {
      var p = pairs[i].split('=');
      var key = decodeURIComponent(p[0]).toLowerCase().trim();
      var val = p[1] ? decodeURIComponent(p[1]).trim().toLowerCase() : '';

      if (key === 's' || key === 'sub' || key === 'subject') return val;
      if (['science', 'geography', 'health', 'civic'].indexOf(key) !== -1) return key;
    }
    return 'science';
  }

  var currentSubject = getSubject();
  var userAnswers = {};
  var currentQuestions = [];
  var lastGeneratedWhatsappUrl = "";

  function loadDailyQuiz() {
    var quizContainer = document.getElementById('quiz-container');
    var submitBtn = document.getElementById('submit-btn');

    var fetchUrl = APPS_SCRIPT_URL + '?s=' + encodeURIComponent(currentSubject);

    fetch(fetchUrl)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.error) throw new Error(data.error);

        document.getElementById('subject-tag').innerText = currentSubject.toUpperCase();
        document.getElementById('title-text').innerText = data.title || (currentSubject.toUpperCase() + ' Practice');
        
        currentQuestions = data.questions || [];
        userAnswers = {};

        if (currentQuestions.length === 0) {
          quizContainer.innerHTML = '<div class="loading-msg">No questions uploaded for today yet! Check back soon.</div>';
          return;
        }

        renderQuestions();
        submitBtn.style.display = 'flex';
      })
      .catch(function(err) {
        quizContainer.innerHTML = '<div class="loading-msg" style="color:var(--incorrect);">⚠️ Could not load quiz.<br><small>' + err.message + '</small></div>';
      });
  }

  function renderQuestions() {
    var container = document.getElementById('quiz-container');
    container.innerHTML = '';

    currentQuestions.forEach(function(q, idx) {
      var card = document.createElement('div');
      card.className = 'quiz-card';

      var qNum = document.createElement('div');
      qNum.className = 'q-number';
      qNum.textContent = 'Question ' + (idx + 1) + ' of ' + currentQuestions.length;
      card.appendChild(qNum);

      var qText = document.createElement('div');
      qText.className = 'q-text';
      qText.textContent = q.q;
      card.appendChild(qText);

      if (q.type === 'mcq') {
        var group = document.createElement('div');
        q.options.forEach(function(opt) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = function() {
            userAnswers[idx] = opt;
            var siblings = group.querySelectorAll('.option-btn');
            siblings.forEach(function(b) { b.classList.remove('selected'); });
            btn.classList.add('selected');
          };
          group.appendChild(btn);
        });
        card.appendChild(group);
      } else {
        var input = document.createElement('input');
        input.type = 'text';
        input.className = 'text-input';
        input.placeholder = 'Type your answer here in English...';
        input.oninput = function(e) {
          userAnswers[idx] = e.target.value.trim();
        };
        card.appendChild(input);
      }

      container.appendChild(card);
    });
  }

  // Combined action: Submit + Evaluate + Show Review + Automatically Open WhatsApp
  function submitAndSend() {
    var score = 0;
    var wrongReport = [];
    var reviewContainer = document.getElementById('review-container');
    reviewContainer.innerHTML = '';

    currentQuestions.forEach(function(q, idx) {
      var uAns = userAnswers[idx] || 'Not answered';
      var isCorrect = uAns.toString().trim().toLowerCase() === q.ans.toString().trim().toLowerCase();
      
      if (isCorrect) {
        score++;
      } else {
        wrongReport.push("Q" + (idx + 1) + ": " + q.q + "\n  ❌ Her Answer: " + uAns + "\n  ✅ Correct: " + q.ans);
      }

      var card = document.createElement('div');
      card.className = 'review-card ' + (isCorrect ? 'correct' : 'incorrect');

      var status = document.createElement('div');
      status.style.fontSize = '0.78rem';
      status.style.fontWeight = '800';
      status.style.color = isCorrect ? 'var(--correct)' : 'var(--incorrect)';
      status.textContent = isCorrect ? '✓ Correct' : '✗ Needs Practice';
      card.appendChild(status);

      var text = document.createElement('div');
      text.style.fontWeight = '600';
      text.style.fontSize = '0.9rem';
      text.style.margin = '4px 0';
      text.textContent = q.q;
      card.appendChild(text);

      var ansDetail = document.createElement('div');
      ansDetail.style.fontSize = '0.85rem';
      ansDetail.innerHTML = 'Your Answer: <b>' + uAns + '</b> | Correct Answer: <b style="color:var(--primary);">' + q.ans + '</b>';
      card.appendChild(ansDetail);

      if (q.sinhala) {
        var sinhalaBox = document.createElement('div');
        sinhalaBox.className = 'sinhala-review';
        sinhalaBox.innerHTML = '💡 <b>Study Tip:</b> ' + q.sinhala;
        card.appendChild(sinhalaBox);
      }

      reviewContainer.appendChild(card);
    });

    var percentage = Math.round((score / currentQuestions.length) * 100);
    document.getElementById('score-text').innerText = score + ' / ' + currentQuestions.length + ' (' + percentage + '%)';
    
    var feedbackEl = document.getElementById('target-feedback');
    if (percentage >= 65) {
      feedbackEl.className = 'target-met';
      feedbackEl.innerText = '🎯 Target Passed (65%+)! Great job! 🌟';
    } else {
      feedbackEl.className = 'target-missed';
      feedbackEl.innerText = '📖 Good try! Read the yellow study tips below to practice!';
    }

    // Switch screen to show reviews behind WhatsApp
    document.getElementById('screen-quiz').style.display = 'none';
    document.getElementById('screen-results').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });

    // Prepare WhatsApp Message
    var text = "📊 *Daily Practice Assessment Report*\n\n" +
               "📌 *Subject:* " + currentSubject.toUpperCase() + "\n" +
               "🎯 *Score:* " + score + "/" + currentQuestions.length + " (" + percentage + "%)\n" +
               "🏆 *Target 65%+ Status:* " + (percentage >= 65 ? "MET ✅" : "NEEDS PRACTICE ⚠️") + "\n\n";

    if (wrongReport.length > 0) {
      text += "📝 *Mistakes & Insights:*\n" + wrongReport.join("\n\n") + "\n\n";
    } else {
      text += "🌟 *Outstanding:* 100% correct answers today!\n\n";
    }

    text += "She has reviewed the English terminology and Sinhala notes.";

    lastGeneratedWhatsappUrl = "https://api.whatsapp.com/send?phone=" + TARGET_PHONE + "&text=" + encodeURIComponent(text);

    // Automatically trigger WhatsApp redirect
    window.location.href = lastGeneratedWhatsappUrl;
  }

  function resendWhatsApp() {
    if (lastGeneratedWhatsappUrl) {
      window.location.href = lastGeneratedWhatsappUrl;
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    loadDailyQuiz();
    document.getElementById('submit-btn').addEventListener('click', submitAndSend);
    document.getElementById('whatsapp-btn-resend').addEventListener('click', resendWhatsApp);
  });
</script>
</body>
</html>
