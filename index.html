<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 6 Daily Practice Booster</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #1E293B;
      --muted: #64748B;
      --correct: #10B981;
      --incorrect: #EF4444;
      --sinhala-bg: #FEF3C7;
      --sinhala-text: #92400E;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 14px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 520px; background: var(--card); border-radius: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.06); padding: 22px; min-height: 90vh; display: flex; flex-direction: column; justify-content: space-between; }

    .header { padding-bottom: 14px; border-bottom: 2px solid #F1F5F9; margin-bottom: 16px; }
    .badge-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .subject-tag { background: var(--primary-light); color: var(--primary); }
    .day-tag { background: #FEF3C7; color: #92400E; }
    .target-tag { background: #DCFCE7; color: #166534; }
    .header h1 { font-size: 1.2rem; color: var(--text); font-weight: 800; }

    .quiz-card { background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 16px; padding: 14px; margin-bottom: 14px; }
    .q-number { font-size: 0.72rem; font-weight: 800; color: var(--primary); text-transform: uppercase; margin-bottom: 4px; }
    .q-text { font-weight: 600; font-size: 0.94rem; margin-bottom: 12px; line-height: 1.45; }
    
    .option-btn { width: 100%; text-align: left; background: #FFFFFF; border: 1.5px solid #CBD5E1; padding: 12px 14px; border-radius: 12px; margin-bottom: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.15s ease; outline: none; }
    .option-btn:hover { background: #F1F5F9; }
    .option-btn.selected { border-color: var(--primary) !important; background: var(--primary-light) !important; color: var(--primary) !important; font-weight: 700 !important; }
    .text-input { width: 100%; padding: 12px 14px; border: 1.5px solid #CBD5E1; border-radius: 12px; font-size: 0.9rem; outline: none; }
    .text-input:focus { border-color: var(--primary); }

    .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 14px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
    .btn-whatsapp { width: 100%; background: #25D366; color: white; border: none; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 12px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3); }

    .score-banner { text-align: center; padding: 16px 0 20px 0; border-bottom: 2px dashed #E2E8F0; margin-bottom: 16px; }
    .score-badge { font-size: 2.6rem; font-weight: 800; color: var(--primary); }
    .target-met { font-size: 0.9rem; font-weight: 700; color: var(--correct); margin-top: 4px; }
    .target-missed { font-size: 0.9rem; font-weight: 700; color: #D97706; margin-top: 4px; }

    .review-card { background: #FFFFFF; border-left: 5px solid var(--primary); padding: 12px 14px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); border-top: 1px solid #F1F5F9; border-right: 1px solid #F1F5F9; border-bottom: 1px solid #F1F5F9; }
    .review-card.correct { border-left-color: var(--correct); }
    .review-card.incorrect { border-left-color: var(--incorrect); }
    .sinhala-review { background: var(--sinhala-bg); color: var(--sinhala-text); padding: 8px 10px; border-radius: 8px; font-size: 0.82rem; margin-top: 8px; line-height: 1.45; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="badge-row">
      <div class="badge subject-tag" id="subject-tag">Subject</div>
      <div class="badge day-tag" id="day-tag">Day 1</div>
      <div class="badge target-tag">Target: 65%+ (13+/20)</div>
    </div>
    <h1 id="title-text">Grade 6 Daily Booster</h1>
  </div>

  <div id="screen-quiz">
    <div id="quiz-container"></div>
    <button class="btn-submit" onclick="submitAnswers()">Submit Answers & View Review</button>
  </div>

  <div id="screen-results" style="display:none;">
    <div class="score-banner">
      <div style="font-size: 0.85rem; color: var(--muted); font-weight: 600;">Daily Assessment Score</div>
      <div class="score-badge" id="score-text">0 / 20</div>
      <div id="target-feedback"></div>
    </div>
    <div id="review-container"></div>
    <button class="btn-whatsapp" onclick="shareWhatsAppDirect()">
      <span>📲</span> Send Detailed Report to Tutor via WhatsApp
    </button>
  </div>
</div>

<script>
  var TARGET_PHONE = "94701543307";

  var questionBank = {
    science: {
      "1": {
        title: "Science: Living World, Plants & Energy (Day 1)",
        questions: [
          { q: "1. What gas is released by green plants during photosynthesis?", options: ["Carbon dioxide", "Oxygen", "Nitrogen", "Hydrogen"], ans: "Oxygen", type: "mcq", sinhala: "Photosynthesis (ප්‍රකාශ සංශ්ලේෂණය) process එකේදී green plants release කරන්නේ Oxygen (ඔක්සිජන්) gas එකයි[cite: 360, 529]." },
          { q: "2. Which of the following is an autotrophic organism?", options: ["Deer", "Lion", "Mango tree", "Mushroom"], ans: "Mango tree", type: "mcq", sinhala: "Autotrophic (ස්වයංපෝෂී) organisms කියන්නේ තමන්ගේම food සාදන green plants වලටයි (Mango tree)[cite: 360, 367]." },
          { q: "3. What apparatus is used to observe microscopic organisms in water?", options: ["Telescope", "Compound microscope", "Rain gauge", "Magnifying glass"], ans: "Compound microscope", type: "mcq", sinhala: "Micro-organisms (ක්ෂුද්‍ර ජීවීන්) observe කරන්න use කරන laboratory apparatus එක Compound microscope (සංයුක්ත අන්වීක්ෂය) වේ[cite: 357, 371]." },
          { q: "4. A plant that shows sleeping movements when touched is:", options: ["Jak", "Mimosa", "Coconut", "Mango"], ans: "Mimosa", type: "mcq", sinhala: "Touch කළ විට sleeping movements (නිදි චලන) දක්වන plant එක Mimosa (නිදිකුම්බා) වේ[cite: 362]." },
          { q: "5. What is the process of matured living beings producing new offspring of their own kind?", options: ["Respiration", "Reproduction", "Nutrition", "Locomotion"], ans: "Reproduction", type: "mcq", sinhala: "New members බිහිකරන process එකට Reproduction (ප්‍රජනනය) කියනු ලැබේ[cite: 364, 372]." },
          { q: "6. Animals that feed only on plants and plant parts are called:", options: ["Carnivores", "Herbivores", "Omnivores", "Autotrophs"], ans: "Herbivores", type: "mcq", sinhala: "Plants පමණක් food එක විදිහට ගන්නා animalsලා Herbivores (ශාකභක්ෂකයින්) වේ[cite: 503, 509]." },
          { q: "7. Which marine organism is stationary (does not show locomotion) but shows movements?", options: ["Fish", "Sea anemone", "Crab", "Dolphin"], ans: "Sea anemone", type: "mcq", sinhala: "Sea anemone (මුහුදු ඇනමනී) locomotion (සංචරණය) පෙන්වන්නේ නැත, movements (චලන) පමණක් දක්වයි[cite: 362]." },
          { q: "8. What is the primary and ultimate natural source of energy on Earth?", options: ["Fossil fuel", "Wind", "Sun", "Biomass"], ans: "Sun", type: "mcq", sinhala: "Earth එකේ main natural energy source (ශක්ති ප්‍රභවය) Sun (සූර්යයා) වේ[cite: 405, 417, 529]." },
          { q: "9. Which of the following is classified as biomass fuel?", options: ["Diesel", "Firewood", "Kerosene", "Coal"], ans: "Firewood", type: "mcq", sinhala: "Firewood (දර) යනු plant parts වලින් direct ලබාගන්නා Biomass (ජෛව ස්කන්ධ) fuel එකකි[cite: 406]." },
          { q: "10. In a food chain, what role is played by green plants?", options: ["Primary consumer", "Secondary consumer", "Producer", "Decomposer"], ans: "Producer", type: "mcq", sinhala: "Food chain එකක solar energy store කරමින් food synthesize කරන first link එක Producer (නිෂ්පාදකයා) වේ[cite: 507, 509]." },
          { q: "11. If the number of leopards decreases in a forest, the deer population will:", options: ["Decrease", "Increase", "Disappear", "Remain unchanged"], ans: "Increase", type: "mcq", sinhala: "Carnivores (මාංශභක්ෂකයින්) අඩු වූ විට herbivores (මුවන්) population එක Increase (වැඩිවීම) වේ[cite: 508, 530]." },
          { q: "12. What state of matter has a definite volume but NO definite shape?", options: ["Solid", "Liquid", "Gas", "Vapour"], ans: "Liquid", type: "mcq", sinhala: "Liquid (ද්‍රව) state එකට definite volume (පරිමාවක්) තිබුණද definite shape (හැඩයක්) නොමැත[cite: 378, 384]." },
          { q: "13. What property describes a metal's ability to be drawn into thin wires?", options: ["Malleability", "Brittleness", "Ductility", "Hardness"], ans: "Ductility", type: "mcq", sinhala: "Metals තුනී wires (කම්බි) බවට stretch කිරීමට හැකි property එක Ductility (තන්‍යතාව) වේ[cite: 382, 386]." },
          { q: "14. Tendency of a solid to break into pieces under a small force is called:", options: ["Elasticity", "Brittleness", "Texture", "Hardness"], ans: "Brittleness", type: "mcq", sinhala: "Force එකක් දැමූ විට පහසුවෙන් break වෙන property එක Brittleness (භංගුරතාව) වේ[cite: 382, 529]." },
          { q: "15. What instrument is used to measure rainfall over a 24-hour period?", options: ["Thermometer", "Barometer", "Rain gauge", "Anemometer"], ans: "Rain gauge", type: "mcq", sinhala: "Rainfall (වර්ෂාපතනය) millimeters වලින් measure කරන්නේ Rain gauge (වර්ෂාමානය) මගිනි[cite: 516, 527, 530]." },
          { q: "16. Which electronic component allows electric current to flow in one direction only?", options: ["Resistor", "Diode", "Switch", "Cell"], ans: "Diode", type: "mcq", sinhala: "Current එක one direction එකකට පමණක් flow වීමට ඉඩදෙන්නේ Diode (දියෝඩය) මගිනි[cite: 475, 483]." },
          { q: "17. Name the gas required by green plants to carry out photosynthesis:", ans: "Carbon dioxide", type: "text", sinhala: "Photosynthesis සඳහා green plants absorb කරන gas එක Carbon dioxide (කාබන්ඩයොක්සයිඩ්) වේ[cite: 360, 507]." },
          { q: "18. What laboratory instrument is used to detect small electric currents?", ans: "Galvanometer", type: "text", sinhala: "Very small current එකක් detect කිරීමට use කරන්නේ Galvanometer (ගැල්වනෝමීටරය) වේ[cite: 464, 471, 531]." },
          { q: "19. What scientific tool categorizes organisms based on presence or absence of features?", ans: "Dichotomous key", type: "text", sinhala: "Characteristics වල presence හෝ absence මත organisms categorize කරන්නේ Dichotomous key (දෙබෙදුම් සූචිය) මගිනි[cite: 368, 372, 529]." },
          { q: "20. Normal human body temperature in degrees Celsius is:", ans: "37", type: "text", sinhala: "Normal human body temperature (සාමාන්‍ය දේහ උෂ්ණත්වය) 37 degrees Celsius වේ[cite: 486, 530]." }
        ]
      }
    },
    geography: {
      "1": {
        title: "Geography: Sri Lanka, Admin Units & Environment (Day 1)",
        questions: [
          { q: "1. What is the smallest administrative unit in Sri Lanka?", options: ["District", "Province", "Grama Niladhari Division", "Divisional Secretariat"], ans: "Grama Niladhari Division", type: "mcq", sinhala: "Sri Lanka වල smallest administrative unit (කුඩාම පරිපාලන ඒකකය) Grama Niladhari Division වේ[cite: 50, 115, 534]." },
          { q: "2. How many administrative districts are there in Sri Lanka?", options: ["9", "25", "18", "12"], ans: "25", type: "mcq", sinhala: "Sri Lanka වල administrative Provinces 9ක් සහ Districts (දිස්ත්‍රික්ක) 25ක් ඇත[cite: 51, 52]." },
          { q: "3. The narrow strip of sea separating Sri Lanka from India is called:", options: ["Bay of Bengal", "Palk Strait", "Arabian Sea", "Mannar Strait"], ans: "Palk Strait", type: "mcq", sinhala: "Sri Lanka සහ India වෙන් කරන 32 km narrow sea strip එක Palk Strait (පෝක් සමුද්‍ර සන්ධිය) වේ[cite: 170, 544]." },
          { q: "4. Which ocean lies to the west of Sri Lanka?", options: ["Pacific Ocean", "Arabian Sea", "Bay of Bengal", "Arctic Ocean"], ans: "Arabian Sea", type: "mcq", sinhala: "Sri Lanka වල West (බටහිර) direction එකේ තියෙන්නේ Arabian Sea (අරාබි මුහුද) ය[cite: 170, 544]." },
          { q: "5. What is the main administrative capital of Sri Lanka?", options: ["Colombo", "Kandy", "Sri Jayewardenepura Kotte", "Galle"], ans: "Sri Jayewardenepura Kotte", type: "mcq", sinhala: "Main administrative capital (පරිපාලන අගනුවර) Sri Jayewardenepura Kotte වේ[cite: 174]." },
          { q: "6. When facing the morning rising sun with arms stretched, your right hand points to:", options: ["North", "South", "East", "West"], ans: "South", type: "mcq", sinhala: "Rising sun දෙසට face කර අත් දිගු කළ විට right hand එක South (දකුණ) direction එක පෙන්වයි[cite: 121, 542]." },
          { q: "7. Which natural harbour in Eastern Sri Lanka historically linked East and West naval routes?", options: ["Galle", "Trincomalee", "Colombo", "Hambantota"], ans: "Trincomalee", type: "mcq", sinhala: "Eastern Sri Lanka වල පිහිටි natural harbour (ස්වාභාවික වරාය) Trincomalee වේ[cite: 174, 535, 544]." },
          { q: "8. Dumbara area in Central Province is famous for which traditional craft?", options: ["Brassware", "Mask making", "Dumbara mats", "Cane crafts"], ans: "Dumbara mats", type: "mcq", sinhala: "Dumbara area එක traditional Dumbara mats (පන් පැදුරු) වලට famous වේ[cite: 147, 534, 542]." },
          { q: "9. Pilimathalawa in Kandy district is renowned for:", options: ["Brassware", "Masks", "Tiles", "Textiles"], ans: "Brassware", type: "mcq", sinhala: "Pilimathalawa area එක traditional Brassware (පිත්තල භාණ්ඩ) වලට famous වේ[cite: 147, 540, 545]." },
          { q: "10. What is the atmospheric condition prevailing for a short period in an area called?", options: ["Climate", "Weather", "Precipitation", "Monsoon"], ans: "Weather", type: "mcq", sinhala: "Short period (කෙටි කාලයක්) තුළ පවතින atmospheric condition එකට Weather (කාලගුණය) කියනු ලැබේ[cite: 125, 512, 544]." },
          { q: "11. Which instrument is used to determine wind direction?", options: ["Anemometer", "Wind vane", "Hygrometer", "Thermometer"], ans: "Wind vane", type: "mcq", sinhala: "Wind direction (සුළඟේ දිශාව) පෙන්වන්නේ Wind vane (සුළං දිශා දර්ශකය) මගිනි[cite: 130, 518]." },
          { q: "12. What bird helps farmers by destroying crop-damaging snails?", options: ["Crow", "Crow-pheasant", "Parrot", "Bat"], ans: "Crow-pheasant", type: "mcq", sinhala: "Crops වලට හානි කරන snails (ගොළුබෙල්ලන්) destroy කරන්නේ Crow-pheasant (ඇටි-කුකුළා) ය[cite: 139, 534, 544]." },
          { q: "13. Which of the following is a non-harmful, renewable source of energy?", options: ["Coal", "Petroleum", "Solar cells", "Diesel"], ans: "Solar cells", type: "mcq", sinhala: "Environment එකට harm නොවන renewable energy source එකක් ලෙස Solar cells (සූර්ය කෝෂ) හඳුන්වයි[cite: 165, 535]." },

    currentSubject = questionBank[rawSub] ? rawSub : 'science';
    var subData = questionBank[currentSubject];
    currentDay = (subData && subData[rawDay]) ? rawDay : '1';

    var quizData = subData[currentDay];
    document.getElementById('subject-tag').innerText = currentSubject.toUpperCase();
    document.getElementById('day-tag').innerText = 'DAY ' + currentDay;
    document.getElementById('title-text').innerText = quizData.title;
    
    currentQuestions = quizData.questions;
    renderQuiz();
  });

  function renderQuiz() {
    var html = '';
    currentQuestions.forEach(function(q, idx) {
      html += '<div class="quiz-card">' +
                '<div class="q-number">Question ' + (idx + 1) + ' of ' + currentQuestions.length + '</div>' +
                '<div class="q-text">' + q.q + '</div>';

      if (q.type === 'mcq') {
        html += '<div class="options-group" data-qidx="' + idx + '">';
        q.options.forEach(function(opt) {
          html += '<button type="button" class="option-btn" onclick="selectOption(this, ' + idx + ', ' + JSON.stringify(opt) + ')">' + opt + '</button>';
        });
        html += '</div>';
      } else {
        html += '<input type="text" class="text-input" placeholder="Type answer in English..." oninput="recordText(' + idx + ', this.value)">';
      }

      html += '</div>';
    });

    document.getElementById('quiz-container').innerHTML = html;
  }

  function selectOption(btnElement, qIdx, value) {
    userAnswers[qIdx] = value;
    var parent = btnElement.parentElement;
    var allBtns = parent.querySelectorAll('.option-btn');
    allBtns.forEach(function(b) { b.classList.remove('selected'); });
    btnElement.classList.add('selected');
  }

  function recordText(qIdx, val) {
    userAnswers[qIdx] = val.trim();
  }

  function submitAnswers() {
    var score = 0;
    var reviewHtml = '';

    currentQuestions.forEach(function(q, idx) {
      var uAns = userAnswers[idx] || 'Not answered';
      var isCorrect = uAns.toString().trim().toLowerCase() === q.ans.toString().trim().toLowerCase();
      if (isCorrect) score++;

      reviewHtml += '<div class="review-card ' + (isCorrect ? 'correct' : 'incorrect') + '">' +
        '<div style="font-size:0.75rem; font-weight:800; color:' + (isCorrect ? 'var(--correct)' : 'var(--incorrect)') + '">' +
          (isCorrect ? '✓ Correct' : '✗ Needs Practice') +
        '</div>' +
        '<div style="font-weight:600; font-size:0.88rem; margin: 4px 0;">' + q.q + '</div>' +
        '<div style="font-size:0.84rem;">Your Answer: <b>' + uAns + '</b> | Correct Answer: <b style="color:var(--primary);">' + q.ans + '</b></div>' +
        '<div class="sinhala-review">💡 <b>Review Note:</b> ' + q.sinhala + '</div>' +
      '</div>';
    });

    var percentage = Math.round((score / currentQuestions.length) * 100);
    document.getElementById('score-text').innerText = score + ' / ' + currentQuestions.length + ' (' + percentage + '%)';
    
    var feedbackEl = document.getElementById('target-feedback');
    if (percentage >= 65) {
      feedbackEl.className = 'target-met';
      feedbackEl.innerText = '🎯 Target Passed (65%+)! Great progress towards the term test!';
    } else {
      feedbackEl.className = 'target-missed';
      feedbackEl.innerText = '📖 You scored below 65%. Please read all review notes below carefully!';
    }

    document.getElementById('review-container').innerHTML = reviewHtml;
    document.getElementById('screen-quiz').style.display = 'none';
    document.getElementById('screen-results').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function shareWhatsAppDirect() {
    var wrongReport = [];
    var correctCount = 0;

    currentQuestions.forEach(function(q, idx) {
      var uAns = userAnswers[idx] || 'Not answered';
      var isCorrect = uAns.toString().trim().toLowerCase() === q.ans.toString().trim().toLowerCase();
      if (isCorrect) {
        correctCount++;
      } else {
        wrongReport.push("Q" + (idx + 1) + ": " + q.q + "\n  ❌ Her Answer: " + uAns + "\n  ✅ Correct: " + q.ans);
      }
    });

    var percentage = Math.round((correctCount / currentQuestions.length) * 100);
    var text = "📊 *Daily Practice Assessment Report*\n\n" +
               "📌 *Subject:* " + currentSubject.toUpperCase() + " (Day " + currentDay + ")\n" +
               "🎯 *Score:* " + correctCount + "/" + currentQuestions.length + " (" + percentage + "%)\n" +
               "🏆 *Target 65%+ Status:* " + (percentage >= 65 ? "MET ✅" : "NEEDS PRACTICE ⚠️") + "\n\n";

    if (wrongReport.length > 0) {
      text += "📝 *Mistakes & Insights:*\n" + wrongReport.join("\n\n") + "\n\n";
    } else {
      text += "🌟 *Outstanding:* 100% correct answers today!\n\n";
    }

    text += "She has reviewed the English terminology and Sinhala notes.";

    var waUrl = "https://api.whatsapp.com/send?phone=" + TARGET_PHONE + "&text=" + encodeURIComponent(text);
    window.location.href = waUrl;
  }
</script>
</body>
</html>
