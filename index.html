<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 6 Daily Practice Booster</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #1E293B;
      --muted: #64748B;
      --correct: #10B981;
      --incorrect: #EF4444;
      --sinhala-bg: #FEF3C7;
      --sinhala-text: #92400E;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 520px; background: var(--card); border-radius: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.06); padding: 22px; min-height: 90vh; display: flex; flex-direction: column; justify-content: space-between; }

    .header { padding-bottom: 14px; border-bottom: 2px solid #F1F5F9; margin-bottom: 16px; }
    .badge-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .subject-tag { background: var(--primary-light); color: var(--primary); }
    .day-tag { background: #FEF3C7; color: #92400E; }
    .target-tag { background: #DCFCE7; color: #166534; }
    .header h1 { font-size: 1.15rem; color: var(--text); font-weight: 800; }

    .quiz-card { background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 16px; padding: 14px; margin-bottom: 14px; }
    .q-number { font-size: 0.72rem; font-weight: 800; color: var(--primary); text-transform: uppercase; margin-bottom: 4px; }
    .q-text { font-weight: 600; font-size: 0.92rem; margin-bottom: 12px; line-height: 1.45; }
    
    .option-btn { width: 100%; text-align: left; background: #FFFFFF; border: 1.5px solid #CBD5E1; padding: 11px 14px; border-radius: 12px; margin-bottom: 7px; font-size: 0.88rem; font-weight: 500; cursor: pointer; transition: all 0.15s ease; }
    .option-btn:hover { background: #F1F5F9; }
    .option-btn.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); font-weight: 700; }
    .text-input { width: 100%; padding: 11px 14px; border: 1.5px solid #CBD5E1; border-radius: 12px; font-size: 0.88rem; outline: none; }
    .text-input:focus { border-color: var(--primary); }

    .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 14px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
    .btn-whatsapp { width: 100%; background: #25D366; color: white; border: none; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 12px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3); }

    .score-banner { text-align: center; padding: 16px 0 20px 0; border-bottom: 2px dashed #E2E8F0; margin-bottom: 16px; }
    .score-badge { font-size: 2.6rem; font-weight: 800; color: var(--primary); }
    .target-met { font-size: 0.9rem; font-weight: 700; color: var(--correct); margin-top: 4px; }
    .target-missed { font-size: 0.9rem; font-weight: 700; color: #D97706; margin-top: 4px; }

    .review-card { background: #FFFFFF; border-left: 5px solid var(--primary); padding: 12px 14px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); border-top: 1px solid #F1F5F9; border-right: 1px solid #F1F5F9; border-bottom: 1px solid #F1F5F9; }
    .review-card.correct { border-left-color: var(--correct); }
    .review-card.incorrect { border-left-color: var(--incorrect); }
    .sinhala-review { background: var(--sinhala-bg); color: var(--sinhala-text); padding: 8px 10px; border-radius: 8px; font-size: 0.8rem; margin-top: 8px; line-height: 1.4; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="badge-row">
      <div class="badge subject-tag" id="subject-tag">Subject</div>
      <div class="badge day-tag" id="day-tag">Day 1</div>
      <div class="badge target-tag">Target: 65%+ (13+/20)</div>
    </div>
    <h1 id="title-text">Grade 6 Daily Booster</h1>
  </div>

  <div id="screen-quiz">
    <div id="quiz-container"></div>
    <button class="btn-submit" onclick="submitAnswers()">Submit Answers & View Review</button>
  </div>

  <div id="screen-results" style="display:none;">
    <div class="score-banner">
      <div style="font-size: 0.85rem; color: var(--muted); font-weight: 600;">Daily Assessment Score</div>
      <div class="score-badge" id="score-text">0 / 20</div>
      <div id="target-feedback"></div>
    </div>
    <div id="review-container"></div>
    <button class="btn-whatsapp" onclick="shareWhatsAppDirect()">
      <span>📲</span> Send Results to Tutor via WhatsApp
    </button>
  </div>
</div>

<script>
  var TARGET_PHONE = "94701543307";

  var questionBank = {
    science: {
      "1": {
        title: "Science: Living World, Plants & Energy (Day 1)",
        questions: [
          { q: "1. What gas is released by green plants during photosynthesis?", options: ["Carbon dioxide", "Oxygen", "Nitrogen", "Hydrogen"], ans: "Oxygen", type: "mcq", sinhala: "Photosynthesis (ප්‍රකාශ සංශ්ලේෂණය): ශාක ආහාර පිළියෙළ කිරීමේදී ඔක්සිජන් (Oxygen) පිටකරයි." },
          { q: "2. Which of the following is an autotrophic organism?", options: ["Deer", "Lion", "Mango tree", "Mushroom"], ans: "Mango tree", type: "mcq", sinhala: "Autotrophic (ස්වයංපෝෂී): තමන්ගේම ආහාර නිපදවාගත හැකි ජීවීන් (හරිත ශාක)." },
          { q: "3. What apparatus is used to observe microscopic organisms in water?", options: ["Telescope", "Compound microscope", "Rain gauge", "Magnifying glass"], ans: "Compound microscope", type: "mcq", sinhala: "Compound microscope (සංයුක්ත අන්වීක්ෂය): ක්ෂුද්‍ර ජීවීන් නිරීක්ෂණයට යොදාගනී." },
          { q: "4. A plant that shows sleeping movements when touched is:", options: ["Jak", "Mimosa", "Coconut", "Mango"], ans: "Mimosa", type: "mcq", sinhala: "Mimosa (නිදිකුම්බා): ස්පර්ශය හමුවේ චලන (sleeping movements) දක්වයි." },
          { q: "5. What is the process of matured living beings producing new offspring of their own kind?", options: ["Respiration", "Reproduction", "Nutrition", "Locomotion"], ans: "Reproduction", type: "mcq", sinhala: "Reproduction (ප්‍රජනනය): තම වර්ගයා බෝ කිරීමයි." },
          { q: "6. Animals that feed only on plants and plant parts are called:", options: ["Carnivores", "Herbivores", "Omnivores", "Autotrophs"], ans: "Herbivores", type: "mcq", sinhala: "Herbivores (ශාකභක්ෂකයින්): ශාක කොටස් පමණක් ආහාරයට ගන්නා සතුන්." },
          { q: "7. Which marine organism is stationary (does not show locomotion) but shows movements?", options: ["Fish", "Sea anemone", "Crab", "Dolphin"], ans: "Sea anemone", type: "mcq", sinhala: "Sea anemone (මුහුදු ඇනමනී): සංචරණය නොකර චලන පමණක් පෙන්වයි." },
          { q: "8. What is the primary and ultimate natural source of energy on Earth?", options: ["Fossil fuel", "Wind", "Sun", "Biomass"], ans: "Sun", type: "mcq", sinhala: "Sun (සූර්යයා): පෘථිවියේ ප්‍රධානතම ස්වාභාවික ශක්ති ප්‍රභවයයි." },
          { q: "9. Which of the following is classified as biomass fuel?", options: ["Diesel", "Firewood", "Kerosene", "Coal"], ans: "Firewood", type: "mcq", sinhala: "Biomass (ජෛව ස්කන්ධ): දර (firewood), ලී කුඩු, දහයියා ඉන්ධන ලෙස භාවිතා වේ." },
          { q: "10. In a food chain, what role is played by green plants?", options: ["Primary consumer", "Secondary consumer", "Producer", "Decomposer"], ans: "Producer", type: "mcq", sinhala: "Producer (නිෂ්පාදකයා): සූර්ය ශක්තිය භාවිතයෙන් ආහාර නිපදවන මුල් පුරුක." },
          { q: "11. If the number of leopards decreases in a forest, the deer population will:", options: ["Decrease", "Increase", "Disappear", "Remain unchanged"], ans: "Increase", type: "mcq", sinhala: "Balance of Ecosystem: විලෝපිකයන් අඩුවූ විට විලෝපිත මුවන් ගහනය වැඩිවේ." },
          { q: "12. What state of matter has a definite volume but NO definite shape?", options: ["Solid", "Liquid", "Gas", "Vapour"], ans: "Liquid", type: "mcq", sinhala: "Liquid (ද්‍රව): නිශ්චිත පරිමාවක් ඇතත් නිශ්චිත හැඩයක් නොමැත." },
          { q: "13. What property describes a metal's ability to be drawn into thin wires?", options: ["Malleability", "Brittleness", "Ductility", "Hardness"], ans: "Ductility", type: "mcq", sinhala: "Ductility (තන්‍යතාව): ලෝහ කම්බි ලෙස ඇදීමේ හැකියාව." },
          { q: "14. Tendency of a solid to break into pieces under a small force is called:", options: ["Elasticity", "Brittleness", "Texture", "Hardness"], ans: "Brittleness", type: "mcq", sinhala: "Brittleness (භංගුරතාව): වීදුරු මෙන් බලයක් යෙදූ විට කැඩී බිඳී යාම." },
          { q: "15. What instrument is used to measure rainfall over a 24-hour period?", options: ["Thermometer", "Barometer", "Rain gauge", "Anemometer"], ans: "Rain gauge", type: "mcq", sinhala: "Rain gauge (වර්ෂාමානය): වර්ෂාපතනය මිලිමීටර වලින් මනින උපකරණය." },
          { q: "16. Which electronic component allows electric current to flow in one direction only?", options: ["Resistor", "Diode", "Switch", "Cell"], ans: "Diode", type: "mcq", sinhala: "Diode (දියෝඩය): විද්‍යුතය එක් දිශාවකට පමණක් ගලා යාමට සලස්වයි." },
          { q: "17. Name the gas required by green plants to carry out photosynthesis:", ans: "Carbon dioxide", type: "text", sinhala: "Carbon dioxide (කාබන්ඩයොක්සයිඩ්): ප්‍රකාශ සංශ්ලේෂණයට අවශ්‍ය වායුව." },
          { q: "18. What laboratory instrument is used to detect small electric currents?", ans: "Galvanometer", type: "text", sinhala: "Galvanometer (ගැල්වනෝමීටරය): කුඩා ධාරා හඳුනාගැනීමට යොදාගනී." },
          { q: "19. What scientific tool categorizes organisms based on presence or absence of features?", ans: "Dichotomous key", type: "text", sinhala: "Dichotomous key (දෙබෙදුම් සූචිය): ලක්ෂණ ඇති/නැති බව අනුව ජීවීන් වර්ගීකරණය." },
          { q: "20. Normal human body temperature in degrees Celsius is:", ans: "37", type: "text", sinhala: "Body Temperature: සාමාන්‍ය නිරෝගී මිනිස් සිරුරේ උෂ්ණත්වය 37°C කි." }
        ]
      }
    },
    geography: {
      "1": {
        title: "Geography: Sri Lanka, Admin Units & Environment (Day 1)",
        questions: [
          { q: "1. What is the smallest administrative unit in Sri Lanka?", options: ["District", "Province", "Grama Niladhari Division", "Divisional Secretariat"], ans: "Grama Niladhari Division", type: "mcq", sinhala: "Grama Niladhari Division (ග්‍රාම නිලධාරී වසම): ශ්‍රී ලංකාවේ කුඩාම පරිපාලන ඒකකයයි." },
          { q: "2. How many administrative districts are there in Sri Lanka?", options: ["9", "25", "18", "12"], ans: "25", type: "mcq", sinhala: "Districts (දිස්ත්‍රික්ක): පළාත් 9ක් සහ පරිපාලන දිස්ත්‍රික්ක 25ක් ඇත." },
          { q: "3. The narrow strip of sea separating Sri Lanka from India is called:", options: ["Bay of Bengal", "Palk Strait", "Arabian Sea", "Mannar Strait"], ans: "Palk Strait", type: "mcq", sinhala: "Palk Strait (පෝක් සමුද්‍ර සන්ධිය): ඉන්දියාවෙන් ශ්‍රී ලංකාව වෙන් කරන කි.මී. 32 ක නොගැඹුරු මුහුදු තීරය." },
          { q: "4. Which ocean lies to the west of Sri Lanka?", options: ["Pacific Ocean", "Arabian Sea", "Bay of Bengal", "Arctic Ocean"], ans: "Arabian Sea", type: "mcq", sinhala: "Arabian Sea (අරාබි මුහුද): ශ්‍රී ලංකාවට බටහිරින් පිහිටි මුහුදු කලාපයයි." },
          { q: "5. What is the main administrative capital of Sri Lanka?", options: ["Colombo", "Kandy", "Sri Jayewardenepura Kotte", "Galle"], ans: "Sri Jayewardenepura Kotte", type: "mcq", sinhala: "Administrative Capital: පරිපාලන අගනුවර ශ්‍රී ජයවර්ධනපුර කෝට්ටේ වේ." },
          { q: "6. When facing the morning rising sun with arms stretched, your right hand points to:", options: ["North", "South", "East", "West"], ans: "South", type: "mcq", sinhala: "Directions (දිශා): නැගෙනහිරට මුහුණලා සිටින විට දකුණු අත දකුණට (South) යොමුවේ." },
          { q: "7. Which natural harbour in Eastern Sri Lanka historically linked East and West naval routes?", options: ["Galle", "Trincomalee", "Colombo", "Hambantota"], ans: "Trincomalee", type: "mcq", sinhala: "Trincomalee (ත්‍රිකුණාමලය): නැගෙනහිර පිහිටි විශිෂ්ට ස්වාභාවික වරාය." },
          { q: "8. Dumbara area in Central Province is famous for which traditional craft?", options: ["Brassware", "Mask making", "Dumbara mats", "Cane crafts"], ans: "Dumbara mats", type: "mcq", sinhala: "Dumbara Mats (දුම්බර රටා පැදුරු): පන් පැදුරු නිෂ්පාදනයට ප්‍රසිද්ධයි." },
          { q: "9. Pilimathalawa in Kandy district is renowned for:", options: ["Brassware", "Masks", "Tiles", "Textiles"], ans: "Brassware", type: "mcq", sinhala: "Pilimathalawa Brassware (පිළිමතලාව පිත්තල කර්මාන්තය)." },

          { q: "11. Listening attentively and comprehensively with understanding is called:", options: ["Hearing", "Active listening", "Casual talk", "Idle conversation"], ans: "Active listening", type: "mcq", sinhala: "Active listening (සක්‍රීය සවන්දීම): අවබෝධයෙන් හා ගෞරවයෙන් සවන්දීම." },
          { q: "12. Professor Senaka Bibile is globally famous for introducing the policy of:", options: ["Free schools", "Affordable essential drugs / Osusala", "Organic fertilizer", "Irrigation dams"], ans: "Affordable essential drugs / Osusala", type: "mcq", sinhala: "Prof. Senaka Bibile: රාජ්‍ය ඔසුසල සහ ඖෂධ ප්‍රතිපත්තිය හඳුන්වා දුන් විද්වතාය." },
          { q: "13. What committee in school brings together parents, past pupils, and teachers for development?", options: ["Board of Prefects", "School Development Committee", "Scouting Committee", "Discipline Committee"], ans: "School Development Committee", type: "mcq", sinhala: "School Development Committee (පාසල් සංවර්ධන සමිතිය)." },
          { q: "14. Standing straight and maintaining eye contact while speaking shows:", options: ["Aggression", "Polite speech and confidence", "Disobedience", "Weakness"], ans: "Polite speech and confidence", type: "mcq", sinhala: "Decorum: සෘජුව හා මිත්‍රශීලීව අදහස් ප්‍රකාශ කිරීම යහපත් ගුණයකි." },
          { q: "15. The ancient miraculous canal conveying water from Kala Wewa to Tissa Wewa is:", options: ["Minipe Ela", "Jaya Ganga", "Kalinga Ela", "Yoda Ela of Ruhuna"], ans: "Jaya Ganga", type: "mcq", sinhala: "Jaya Ganga (ජය ගඟ / යෝධ ඇළ): සැතපුමකට අඟල් 6ක බෑවුමක් සහිත වාරි නිර්මාණයකි." },
          { q: "16. Which ancient rock-carved Buddha statue stands 39 feet 10 inches high near Kala Wewa?", options: ["Gal Viharaya", "Avukana statue", "Buduruvagala", "Maligawila"], ans: "Avukana statue", type: "mcq", sinhala: "Avukana statue (අවුකන බුදු පිළිමය): උස අඩි 39 අඟල් 10 කි." },
          { q: "17. What official government document officially proves a student's full name and age?", ans: "Birth certificate", type: "text", sinhala: "Birth Certificate (උප්පැන්න සහතිකය): අනන්‍යතාව හා වයස තහවුරු කරයි." },
          { q: "18. What symbol on a school uniform represents the school identity and motto?", ans: "School crest", type: "text", sinhala: "School Crest (පාසල් ලාංඡනය): පාසලේ අනන්‍යතාව කියාපායි." },
          { q: "19. The administrative head of an Urban Council is called the:", ans: "Chairman", type: "text", sinhala: "Urban Council Head: සභාපති (Chairman)." },
          { q: "20. The smallest administrative area under local government administration is the:", ans: "Grama Niladhari Division", type: "text", sinhala: "Administrative hierarchy: කුඩාම ප්‍රාදේශීය පරිපාලන ඒකකයයි." }
        ]
      }
    }
  };

  function getQueryParam(param) {
    var href = window.location.href;
    var reg = new RegExp('[?&]' + param + '=([^&#]*)', 'i');
    var string = reg.exec(href);
    return string ? decodeURIComponent(string[1]) : null;
  }

  var currentSubject = 'science';
  var currentDay = '1';
  var userAnswers = {};
  var currentQuestions = [];

  window.addEventListener('DOMContentLoaded', function() {
    var rawSub = (getQueryParam('s') || getQueryParam('subject') || 'science').toLowerCase().trim();
    var rawDay = (getQueryParam('d') || getQueryParam('day') || '1').trim();

    if (rawSub === 'sci') rawSub = 'science';
    if (rawSub === 'geo') rawSub = 'geography';
    if (rawSub === 'hpe' || rawSub === 'hp') rawSub = 'health';
    if (rawSub === 'civ' || rawSub === 'civics') rawSub = 'civic';

    currentSubject = questionBank[rawSub] ? rawSub : 'science';
    var subData = questionBank[currentSubject];
    currentDay = (subData && subData[rawDay]) ? rawDay : '1';

    var quizData = subData[currentDay];
    document.getElementById('subject-tag').innerText = currentSubject.toUpperCase();
    document.getElementById('day-tag').innerText = 'DAY ' + currentDay;
    document.getElementById('title-text').innerText = quizData.title;
    
    currentQuestions = quizData.questions;
    renderQuiz();
  });

  function renderQuiz() {
    var html = '';
    currentQuestions.forEach(function(q, idx) {
      html += '<div class="quiz-card">' +
                '<div class="q-number">Question ' + (idx + 1) + ' of ' + currentQuestions.length + '</div>' +
                '<div class="q-text">' + q.q + '</div>';

      if (q.type === 'mcq') {
        q.options.forEach(function(opt) {
          var cleanOpt = opt.replace(/[^a-zA-Z0-9]/g, '');
          html += '<button type="button" class="option-btn" id="opt-' + idx + '-' + cleanOpt + '" onclick="selectMCQ(' + idx + ', ' + JSON.stringify(opt) + ')">' + opt + '</button>';
        });
      } else {
        html += '<input type="text" class="text-input" placeholder="Type answer in English..." oninput="selectText(' + idx + ', this.value)">';
      }

      html += '</div>';
    });

    document.getElementById('quiz-container').innerHTML = html;
  }

  function selectMCQ(qIdx, val) {
    userAnswers[qIdx] = val;
    var opts = document.querySelectorAll('[id^="opt-' + qIdx + '-"]');
    opts.forEach(function(btn) { btn.classList.remove('selected'); });
    var cleanVal = val.replace(/[^a-zA-Z0-9]/g, '');
    var el = document.getElementById('opt-' + qIdx + '-' + cleanVal);
    if (el) el.classList.add('selected');
  }

  function selectText(qIdx, val) {
    userAnswers[qIdx] = val.trim();
  }

  function submitAnswers() {
    var score = 0;
    var reviewHtml = '';

    currentQuestions.forEach(function(q, idx) {
      var uAns = userAnswers[idx] || 'Not answered';
      var isCorrect = uAns.toString().trim().toLowerCase() === q.ans.toString().trim().toLowerCase();
      if (isCorrect) score++;

      reviewHtml += '<div class="review-card ' + (isCorrect ? 'correct' : 'incorrect') + '">' +
        '<div style="font-size:0.75rem; font-weight:800; color:' + (isCorrect ? 'var(--correct)' : 'var(--incorrect)') + '">' +
          (isCorrect ? '✓ Correct' : '✗ Needs Practice') +
        '</div>' +
        '<div style="font-weight:600; font-size:0.88rem; margin: 4px 0;">' + q.q + '</div>' +
        '<div style="font-size:0.82rem;">Your Answer: <b>' + uAns + '</b> | Correct Answer: <b style="color:var(--primary);">' + q.ans + '</b></div>' +
        '<div class="sinhala-review">💡 <b>Sinhala Guide:</b> ' + q.sinhala + '</div>' +
      '</div>';
    });

    var percentage = Math.round((score / currentQuestions.length) * 100);
    document.getElementById('score-text').innerText = score + ' / ' + currentQuestions.length + ' (' + percentage + '%)';
    
    var feedbackEl = document.getElementById('target-feedback');
    if (percentage >= 65) {
      feedbackEl.className = 'target-met';
      feedbackEl.innerText = '🎯 Target Passed (65%+)! Well done, keep this momentum!';
    } else {
      feedbackEl.className = 'target-missed';
      feedbackEl.innerText = '📖 You scored below 65%. Please read all Sinhala notes below carefully!';
    }

    document.getElementById('review-container').innerHTML = reviewHtml;
    document.getElementById('screen-quiz').style.display = 'none';
    document.getElementById('screen-results').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function shareWhatsAppDirect() {
    var score = document.getElementById('score-text').innerText;
    var text = "Hello Sir! I completed my Grade 6 " + currentSubject.toUpperCase() + " (Day " + currentDay + ") Booster Quiz.\n" +
               "My Score: " + score + "\n" +
               "I reviewed my mistakes and read the Sinhala explanations!";
    var waUrl = "https://api.whatsapp.com/send?phone=" + TARGET_PHONE + "&text=" + encodeURIComponent(text);
    window.location.href = waUrl;
  }
</script>
