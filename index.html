<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 6 Daily Practice Booster</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #1E293B;
      --muted: #64748B;
      --correct: #10B981;
      --incorrect: #EF4444;
      --sinhala-bg: #FEF3C7;
      --sinhala-text: #92400E;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 14px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 520px; background: var(--card); border-radius: 24px; box-shadow: 0 12px 30px rgba(0,0,0,0.06); padding: 22px; min-height: 90vh; display: flex; flex-direction: column; justify-content: space-between; }

    .header { padding-bottom: 14px; border-bottom: 2px solid #F1F5F9; margin-bottom: 16px; }
    .badge-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .subject-tag { background: var(--primary-light); color: var(--primary); }
    .day-tag { background: #FEF3C7; color: #92400E; }
    .target-tag { background: #DCFCE7; color: #166534; }
    .header h1 { font-size: 1.2rem; color: var(--text); font-weight: 800; }

    .quiz-card { background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 16px; padding: 14px; margin-bottom: 14px; }
    .q-number { font-size: 0.72rem; font-weight: 800; color: var(--primary); text-transform: uppercase; margin-bottom: 4px; }
    .q-text { font-weight: 600; font-size: 0.94rem; margin-bottom: 12px; line-height: 1.45; }
    
    .option-btn { width: 100%; text-align: left; background: #FFFFFF; border: 1.5px solid #CBD5E1; padding: 12px 14px; border-radius: 12px; margin-bottom: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.15s ease; outline: none; }
    .option-btn:hover { background: #F1F5F9; }
    .option-btn.selected { border-color: var(--primary) !important; background: var(--primary-light) !important; color: var(--primary) !important; font-weight: 700 !important; }
    .text-input { width: 100%; padding: 12px 14px; border: 1.5px solid #CBD5E1; border-radius: 12px; font-size: 0.9rem; outline: none; }
    .text-input:focus { border-color: var(--primary); }

    .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 14px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
    .btn-whatsapp { width: 100%; background: #25D366; color: white; border: none; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 12px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3); }

    .score-banner { text-align: center; padding: 16px 0 20px 0; border-bottom: 2px dashed #E2E8F0; margin-bottom: 16px; }
    .score-badge { font-size: 2.6rem; font-weight: 800; color: var(--primary); }
    .target-met { font-size: 0.9rem; font-weight: 700; color: var(--correct); margin-top: 4px; }
    .target-missed { font-size: 0.9rem; font-weight: 700; color: #D97706; margin-top: 4px; }

    .review-card { background: #FFFFFF; border-left: 5px solid var(--primary); padding: 12px 14px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); border-top: 1px solid #F1F5F9; border-right: 1px solid #F1F5F9; border-bottom: 1px solid #F1F5F9; }
    .review-card.correct { border-left-color: var(--correct); }
    .review-card.incorrect { border-left-color: var(--incorrect); }
    .sinhala-review { background: var(--sinhala-bg); color: var(--sinhala-text); padding: 8px 10px; border-radius: 8px; font-size: 0.82rem; margin-top: 8px; line-height: 1.45; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="badge-row">
      <div class="badge subject-tag" id="subject-tag">Subject</div>
      <div class="badge day-tag" id="day-tag">Day 1</div>
      <div class="badge target-tag">Target: 65%+ (13+/20)</div>
    </div>
    <h1 id="title-text">Grade 6 Daily Booster</h1>
  </div>

  <div id="screen-quiz">
    <div id="quiz-container"></div>
    <button class="btn-submit" id="submit-btn" type="button">Submit Answers & View Review</button>
  </div>

  <div id="screen-results" style="display:none;">
    <div class="score-banner">
      <div style="font-size: 0.85rem; color: var(--muted); font-weight: 600;">Daily Test Score</div>
      <div class="score-badge" id="score-text">0 / 20</div>
      <div id="target-feedback"></div>
    </div>
    <div id="review-container"></div>
    <button class="btn-whatsapp" id="whatsapp-btn" type="button">
      <span>📲</span> Send Detailed Report to Tutor via WhatsApp
    </button>
  </div>
</div>

<script>
  var TARGET_PHONE = "94701543307";

  var questionBank = {
    science: {
      "1": {
        title: "Science: Living World & Energy (Day 1)",
        questions: [
          { q: "1. What is the gas released during photosynthesis?", options: ["Carbon dioxide", "Oxygen", "Nitrogen", "Hydrogen"], ans: "Oxygen", type: "mcq", sinhala: "Photosynthesis (ප්‍රභාසංස්ලේෂණය) වලදී පිටවෙන gas එක Oxygen (ඔක්සිජන්) වේ." },
          { q: "2. Which living thing can make its own food?", options: ["Deer", "Lion", "Mango tree", "Mushroom"], ans: "Mango tree", type: "mcq", sinhala: "Autotrophic (ස්වයංපෝෂී) ශාක තමන්ගේම food සාදාගනී (Mango tree)." },
          { q: "3. Which instrument is used to see micro-organisms in pond water?", options: ["Telescope", "Compound microscope", "Rain gauge", "Magnifying glass"], ans: "Compound microscope", type: "mcq", sinhala: "Micro-organisms (ක්ෂුද්‍ර ජීවීන්) බලන්නේ Compound microscope (සංයුක්ත අන්වීක්ෂය) එකෙනි." },
          { q: "4. Which plant shows sleeping movements when we touch it?", options: ["Jak", "Mimosa", "Coconut", "Mango"], ans: "Mimosa", type: "mcq", sinhala: "Touch කළ විට sleeping movements (නිදි චලන) දක්වන්නේ Mimosa (නිදිකුම්බා) ය." },
          { q: "5. Producing new baby animals or plants of the same kind is called:", options: ["Respiration", "Reproduction", "Nutrition", "Locomotion"], ans: "Reproduction", type: "mcq", sinhala: "පැටවුන් හෝ නව පැල බිහිකිරීම Reproduction (ප්‍රජනනය) වේ." },
          { q: "6. Animals that eat only plants are called:", options: ["Carnivores", "Herbivores", "Omnivores", "Autotrophs"], ans: "Herbivores", type: "mcq", sinhala: "Plants පමණක් කන සතුන් Herbivores (ශාක භක්ෂකයින්) වේ." },
          { q: "7. Which sea animal cannot walk or swim from place to place, but moves its body?", options: ["Fish", "Sea anemone", "Crab", "Dolphin"], ans: "Sea anemone", type: "mcq", sinhala: "Locomotion (තැනකින් තැනකට යාම) නැති නමුත් movements ඇති සතෙකි Sea anemone (මුහුදු ඇනමනී)." },
          { q: "8. What is the main source of energy on Earth?", options: ["Fossil fuel", "Wind", "Sun", "Biomass"], ans: "Sun", type: "mcq", sinhala: "Earth එකේ main natural energy source (ශක්ති ප්‍රභවය) Sun (සූර්යයා) වේ." },
          { q: "9. Which one is an example of biomass fuel?", options: ["Diesel", "Firewood", "Kerosene", "Coal"], ans: "Firewood", type: "mcq", sinhala: "ශාක වලින් ගන්නා Biomass (ජෛව ස්කන්ධ) ඉන්ධනයක් වන්නේ Firewood (දර) ය." },
          { q: "10. In a food chain, green plants are called:", options: ["Primary consumer", "Secondary consumer", "Producer", "Decomposer"], ans: "Producer", type: "mcq", sinhala: "Food chain එකක ආහාර හදන green plants හඳුන්වන්නේ Producer (නිෂ්පාදකයා) නමිනි." },
          { q: "11. If the number of leopards goes down in a jungle, what happens to deers?", options: ["Decrease", "Increase", "Disappear", "No change"], ans: "Increase", type: "mcq", sinhala: "කොටි අඩුවූ විට deers (මුවන්) ගණන Increase (වැඩිවීම) වේ." },
          { q: "12. What state of matter has a definite volume, but no definite shape?", options: ["Solid", "Liquid", "Gas", "Vapour"], ans: "Liquid", type: "mcq", sinhala: "Definite volume (පරිමාවක්) ඇති නමුත් definite shape (හැඩයක්) නැත්තේ Liquid (ද්‍රව) වලටයි." },
          { q: "13. What property lets us draw metals into thin wires?", options: ["Malleability", "Brittleness", "Ductility", "Hardness"], ans: "Ductility", type: "mcq", sinhala: "ලෝහ wires (කම්බි) ලෙස ඇදීමේ ගුණය Ductility (තන්‍යතාව) වේ." },
          { q: "14. What property makes glass break into pieces easily?", options: ["Elasticity", "Brittleness", "Texture", "Hardness"], ans: "Brittleness", type: "mcq", sinhala: "පහසුවෙන් කැඩී බිඳී යන ගුණය Brittleness (භංගුරතාව) වේ." },
          { q: "15. What instrument is used to measure rainfall in millimetres?", options: ["Thermometer", "Barometer", "Rain gauge", "Anemometer"], ans: "Rain gauge", type: "mcq", sinhala: "Rainfall (වර්ෂාපතනය) මනින්නේ Rain gauge (වර්ෂාමානය) එකෙනි." },
          { q: "16. Which component lets current flow in only one direction?", options: ["Resistor", "Diode", "Switch", "Cell"], ans: "Diode", type: "mcq", sinhala: "Current එක එක පැත්තකට විතරක් යවන්නේ Diode (දියෝඩය) මගිනි." },
          { q: "17. Name the gas needed by plants for photosynthesis:", ans: "Carbon dioxide", type: "text", sinhala: "Photosynthesis සඳහා plants වලට ඕන gas එක Carbon dioxide (කාබන්ඩයොක්සයිඩ්) වේ." },
          { q: "18. Name the instrument used to find very small currents in a circuit:", ans: "Galvanometer", type: "text", sinhala: "කුඩා currents අඳුනගන්නේ Galvanometer (ගැල්වනෝමීටරය) එකෙනි." },
          { q: "19. What key is used to group animals and plants by yes or no features?", ans: "Dichotomous key", type: "text", sinhala: "ලක්ෂණ ඇති/නැති බව බලලා වර්ග කරන්නේ Dichotomous key (දෙබෙදුම් සූචිය) එකෙනි." },
          { q: "20. Normal human body temperature in degrees Celsius is:", ans: "37", type: "text", sinhala: "සාමාන්‍ය body temperature (දේහ උෂ්ණත්වය) 37 degrees Celsius වේ." }
        ]
      }
    },
    geography: {
      "1": {

        questions: [
          { q: "1. What is the smallest administrative unit in Sri Lanka?", options: ["District", "Province", "Grama Niladhari Division", "Divisional Secretariat"], ans: "Grama Niladhari Division", type: "mcq", sinhala: "ලංකාවේ smallest administrative unit (කුඩාම පරිපාලන ඒකකය) Grama Niladhari Division වේ." },
          { q: "2. How many administrative districts are there in Sri Lanka?", options: ["9", "25", "18", "12"], ans: "25", type: "mcq", sinhala: "Sri Lanka වල Provinces 9 ක් සහ Districts (දිස්ත්‍රික්ක) 25 ක් තියෙනවා." },
          { q: "3. What is the narrow sea that separates Sri Lanka and India?", options: ["Bay of Bengal", "Palk Strait", "Arabian Sea", "Mannar Strait"], ans: "Palk Strait", type: "mcq", sinhala: "Sri Lanka සහ India වෙන් කරන මුහුදු තීරය Palk Strait (පෝක් සමුද්‍ර සන්ධිය) වේ." },
          { q: "4. Which sea is located to the west of Sri Lanka?", options: ["Pacific Ocean", "Arabian Sea", "Bay of Bengal", "Arctic Ocean"], ans: "Arabian Sea", type: "mcq", sinhala: "ශ්‍රී ලංකාවට West (බටහිරින්) තියෙන්නේ Arabian Sea (අරාබි මුහුද) ය." },
          { q: "5. What is the administrative capital city of Sri Lanka?", options: ["Colombo", "Kandy", "Sri Jayewardenepura Kotte", "Galle"], ans: "Sri Jayewardenepura Kotte", type: "mcq", sinhala: "ලංකාවේ administrative capital (පරිපාලන අගනුවර) Sri Jayewardenepura Kotte වේ." },

          { q: "7. Which city has a famous natural harbour in Eastern Sri Lanka?", options: ["Galle", "Trincomalee", "Colombo", "Hambantota"], ans: "Trincomalee", type: "mcq", sinhala: "Eastern Sri Lanka වල තියෙන natural harbour (ස්වාභාවික වරාය) Trincomalee වේ." },
          { q: "8. Dumbara area in Sri Lanka is famous for which traditional item?", options: ["Brassware", "Masks", "Dumbara mats", "Cane baskets"], ans: "Dumbara mats", type: "mcq", sinhala: "Dumbara ප්‍රදේශය famous වෙන්නේ Dumbara mats (පන් පැදුරු) වලටයි." },
          { q: "9. Pilimathalawa area in Kandy is famous for making:", options: ["Brassware", "Masks", "Tiles", "Cloth"], ans: "Brassware", type: "mcq", sinhala: "Pilimathalawa ප්‍රසිද්ධ වෙන්නේ Brassware (පිත්තල බඩු) වලටයි." },
          { q: "10. Atmospheric condition of a place for a short time is called:", options: ["Climate", "Weather", "Precipitation", "Monsoon"], ans: "Weather", type: "mcq", sinhala: "කෙටි වෙලාවක වායුගෝල තත්ත්වය Weather (කාලගුණය) වේ." },
          { q: "11. Which tool shows the direction the wind is blowing?", options: ["Anemometer", "Wind vane", "Hygrometer", "Thermometer"], ans: "Wind vane", type: "mcq", sinhala: "Wind direction (සුළඟේ දිශාව) බලන්නේ Wind vane (සුළං දිශා දර්ශකය) එකෙනි." },
          { q: "12. What bird helps farmers by eating snails in crops?", options: ["Crow", "Crow-pheasant", "Parrot", "Bat"], ans: "Crow-pheasant", type: "mcq", sinhala: "Snails (ගොළුබෙල්ලන්) කන්නේ Crow-pheasant (ඇටි-කුකුළා) ය." },

          { q: "14. What is the code number for the Southern Expressway?", options: ["E01", "A01", "B02", "E04"], ans: "E01", type: "mcq", sinhala: "Southern Expressway (දකුණු අධිවේගී මාර්ගය) හඳුන්වන්නේ E01 නමිනි." },
          { q: "15. Which northern area is famous for growing grapes, onions and chillies?", options: ["Nuwara Eliya", "Jaffna", "Hambantota", "Ratnapura"], ans: "Jaffna", type: "mcq", sinhala: "Grapes සහ onions වගාවට famous වෙන්නේ Jaffna (යාපනය) ය." },

  function parseQueryParams() {
    var query = window.location.search.substring(1);
    var result = { subject: null, day: '1' };
    if (!query) return result;

    var pairs = query.split('&');
    for (var i = 0; i < pairs.length; i++) {
      var pair = pairs[i].split('=');
      var key = decodeURIComponent(pair[0]).toLowerCase().trim();
      var val = pair[1] ? decodeURIComponent(pair[1]).trim() : '';

      if (['science', 'sci', 'geography', 'geo', 'health', 'hpe', 'hp', 'civic', 'civ', 'civics'].indexOf(key) !== -1) {
        result.subject = key;
      }
      if (key === 's' || key === 'subject') {
        result.subject = val.toLowerCase();
      }
      if (key === 'd' || key === 'day') {
        result.day = val || '1';
      }
    }
    return result;
  }

  var currentSubject = 'science';
  var currentDay = '1';
  var userAnswers = {};
  var currentQuestions = [];

  function initApp() {
    var params = parseQueryParams();
    var rawSub = (params.subject || 'science').toLowerCase().trim();
    var rawDay = (params.day || '1').trim();

    if (rawSub === 'sci') rawSub = 'science';
    if (rawSub === 'geo') rawSub = 'geography';
    if (rawSub === 'hpe' || rawSub === 'hp') rawSub = 'health';
    if (rawSub === 'civ' || rawSub === 'civics') rawSub = 'civic';

    currentSubject = questionBank[rawSub] ? rawSub : 'science';
    var subData = questionBank[currentSubject];
    currentDay = (subData && subData[rawDay]) ? rawDay : '1';

    var quizData = subData[currentDay];
    document.getElementById('subject-tag').innerText = currentSubject.toUpperCase();
    document.getElementById('day-tag').innerText = 'DAY ' + currentDay;
    document.getElementById('title-text').innerText = quizData.title;
    
    currentQuestions = quizData.questions;
    renderQuiz();

    document.getElementById('submit-btn').addEventListener('click', submitAnswers);
    document.getElementById('whatsapp-btn').addEventListener('click', shareWhatsAppDirect);

    var quizContainer = document.getElementById('quiz-container');
    quizContainer.addEventListener('click', function(e) {
      var btn = e.target.closest('.option-btn');
      if (!btn) return;
      var qIdx = parseInt(btn.getAttribute('data-qidx'), 10);
      var val = btn.getAttribute('data-val');
      
      userAnswers[qIdx] = val;

      var group = btn.closest('.options-group');
      var allBtns = group.querySelectorAll('.option-btn');
      allBtns.forEach(function(b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
    });

    quizContainer.addEventListener('input', function(e) {
      if (e.target.classList.contains('text-input')) {
        var qIdx = parseInt(e.target.getAttribute('data-qidx'), 10);
        userAnswers[qIdx] = e.target.value.trim();
      }
    });
  }

  function renderQuiz() {
    var container = document.getElementById('quiz-container');
    container.innerHTML = '';

    currentQuestions.forEach(function(q, idx) {
      var card = document.createElement('div');
      card.className = 'quiz-card';

      var qNum = document.createElement('div');
      qNum.className = 'q-number';
      qNum.textContent = 'Question ' + (idx + 1) + ' of ' + currentQuestions.length;
      card.appendChild(qNum);

      var qText = document.createElement('div');
      qText.className = 'q-text';
      qText.textContent = q.q;
      card.appendChild(qText);

      if (q.type === 'mcq') {
        var group = document.createElement('div');
        group.className = 'options-group';
        q.options.forEach(function(opt) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'option-btn';
          btn.setAttribute('data-qidx', idx);
          btn.setAttribute('data-val', opt);
          btn.textContent = opt;
          group.appendChild(btn);
        });
        card.appendChild(group);
      } else {
        var input = document.createElement('input');
        input.type = 'text';
        input.className = 'text-input';
        input.setAttribute('data-qidx', idx);
        input.placeholder = 'Type answer in English...';
        card.appendChild(input);
      }

      container.appendChild(card);
    });
  }

  function submitAnswers() {
    var score = 0;
    var reviewContainer = document.getElementById('review-container');
    reviewContainer.innerHTML = '';

    currentQuestions.forEach(function(q, idx) {
      var uAns = userAnswers[idx] || 'Not answered';
      var isCorrect = uAns.toString().trim().toLowerCase() === q.ans.toString().trim().toLowerCase();
      if (isCorrect) score++;

      var card = document.createElement('div');
      card.className = 'review-card ' + (isCorrect ? 'correct' : 'incorrect');

      var status = document.createElement('div');
      status.style.fontSize = '0.75rem';
      status.style.fontWeight = '800';
      status.style.color = isCorrect ? 'var(--correct)' : 'var(--incorrect)';
      status.textContent = isCorrect ? '✓ Correct' : '✗ Needs Practice';
      card.appendChild(status);

      var text = document.createElement('div');
      text.style.fontWeight = '600';
      text.style.fontSize = '0.88rem';
      text.style.margin = '4px 0';
      text.textContent = q.q;
      card.appendChild(text);

      var ansDetail = document.createElement('div');
      ansDetail.style.fontSize = '0.84rem';
      ansDetail.innerHTML = 'Your Answer: <b>' + uAns + '</b> | Correct Answer: <b style="color:var(--primary);">' + q.ans + '</b>';
      card.appendChild(ansDetail);

      var sinhalaBox = document.createElement('div');
      sinhalaBox.className = 'sinhala-review';
      sinhalaBox.innerHTML = '💡 <b>Study Tip:</b> ' + q.sinhala;
      card.appendChild(sinhalaBox);

      reviewContainer.appendChild(card);
    });

    var percentage = Math.round((score / currentQuestions.length) * 100);
    document.getElementById('score-text').innerText = score + ' / ' + currentQuestions.length + ' (' + percentage + '%)';
    
    var feedbackEl = document.getElementById('target-feedback');
    if (percentage >= 65) {
      feedbackEl.className = 'target-met';
      feedbackEl.innerText = '🎯 Target Passed (65%+)! Great job, keep it up!';
    } else {
      feedbackEl.className = 'target-missed';
      feedbackEl.innerText = '📖 You got below 65%. Read the study tips below to learn the words!';
    }

    document.getElementById('screen-quiz').style.display = 'none';
    document.getElementById('screen-results').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function shareWhatsAppDirect() {
    var wrongReport = [];
    var correctCount = 0;

    currentQuestions.forEach(function(q, idx) {
      var uAns = userAnswers[idx] || 'Not answered';
      var isCorrect = uAns.toString().trim().toLowerCase() === q.ans.toString().trim().toLowerCase();
      if (isCorrect) {
        correctCount++;
      } else {
        wrongReport.push("Q" + (idx + 1) + ": " + q.q + "\n  ❌ Her Answer: " + uAns + "\n  ✅ Correct: " + q.ans);
      }
    });

    var percentage = Math.round((correctCount / currentQuestions.length) * 100);
    var text = "📊 *Daily Practice Assessment Report*\n\n" +
               "📌 *Subject:* " + currentSubject.toUpperCase() + " (Day " + currentDay + ")\n" +
               "🎯 *Score:* " + correctCount + "/" + currentQuestions.length + " (" + percentage + "%)\n" +
               "🏆 *Target 65%+ Status:* " + (percentage >= 65 ? "MET ✅" : "NEEDS PRACTICE ⚠️") + "\n\n";

    if (wrongReport.length > 0) {
      text += "📝 *Mistakes & Insights:*\n" + wrongReport.join("\n\n") + "\n\n";
    } else {
      text += "🌟 *Outstanding:* 100% correct answers today!\n\n";
    }

    text += "She has reviewed the English terminology and Sinhala notes.";

    var waUrl = "https://api.whatsapp.com/send?phone=" + TARGET_PHONE + "&text=" + encodeURIComponent(text);
    window.location.href = waUrl;
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }
</script>
</body>
</html>
