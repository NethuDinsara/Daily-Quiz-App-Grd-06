<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 6 Daily Practice Booster</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #1E293B;
      --muted: #64748B;
      --correct: #10B981;
      --incorrect: #EF4444;
      --sinhala-bg: #FEF3C7;
      --sinhala-text: #92400E;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: 14px; 
      display: flex; 
      justify-content: center; 
    }
    
    .app-container { 
      width: 100%; 
      max-width: 520px; 
      background: var(--card); 
      border-radius: 24px; 
      box-shadow: 0 12px 30px rgba(0,0,0,0.06); 
      padding: 22px; 
      min-height: 90vh; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
    }

    .header { 
      padding-bottom: 14px; 
      border-bottom: 2px solid #F1F5F9; 
      margin-bottom: 16px; 
    }
    
    .badge-row { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 8px; 
      flex-wrap: wrap; 
    }
    
    .badge { 
      display: inline-block; 
      padding: 4px 12px; 
      border-radius: 20px; 
      font-size: 0.75rem; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
    }
    
    .subject-tag { background: var(--primary-light); color: var(--primary); }
    .day-tag { background: #FEF3C7; color: #92400E; }
    .target-tag { background: #DCFCE7; color: #166534; }
    .header h1 { font-size: 1.2rem; color: var(--text); font-weight: 800; }

    .selector-bar { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 16px; 
    }
    
    .select-dropdown { 
      flex: 1; 
      padding: 10px 12px; 
      border-radius: 12px; 
      border: 1.5px solid #CBD5E1; 
      font-weight: 600; 
      outline: none; 
      background: #FFF; 
      font-size: 0.88rem; 
      cursor: pointer;
    }

    .quiz-card { 
      background: #F8FAFC; 
      border: 1.5px solid #E2E8F0; 
      border-radius: 16px; 
      padding: 14px; 
      margin-bottom: 14px; 
    }
    
    .q-number { 
      font-size: 0.72rem; 
      font-weight: 800; 
      color: var(--primary); 
      text-transform: uppercase; 
      margin-bottom: 4px; 
    }
    
    .q-text { 
      font-weight: 600; 
      font-size: 0.94rem; 
      margin-bottom: 12px; 
      line-height: 1.45; 
    }

    .option-btn { 
      width: 100%; 
      text-align: left; 
      background: #FFFFFF; 
      border: 1.5px solid #CBD5E1; 
      padding: 12px 14px; 
      border-radius: 12px; 
      margin-bottom: 8px; 
      font-size: 0.9rem; 
      font-weight: 500; 
      cursor: pointer; 
      transition: all 0.15s ease; 
      outline: none; 
    }
    
    .option-btn:hover { background: #F1F5F9; }
    .option-btn.selected { 
      border-color: var(--primary) !important; 
      background: var(--primary-light) !important; 
      color: var(--primary) !important; 
      font-weight: 700 !important; 
    }
    
    .text-input { 
      width: 100%; 
      padding: 12px 14px; 
      border: 1.5px solid #CBD5E1; 
      border-radius: 12px; 
      font-size: 0.9rem; 
      outline: none; 
    }
    
    .text-input:focus { border-color: var(--primary); }

    .btn-submit { 
      width: 100%; 
      background: var(--primary); 
      color: white; 
      border: none; 
      padding: 15px; 
      border-radius: 14px; 
      font-weight: 700; 
      font-size: 1rem; 
      cursor: pointer; 
      margin-top: 10px; 
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); 
    }
    
    .btn-whatsapp { 
      width: 100%; 
      background: #25D366; 
      color: white; 
      border: none; 
      padding: 14px; 
      border-radius: 14px; 
      font-weight: 700; 
      font-size: 0.95rem; 
      cursor: pointer; 
      margin-top: 12px; 
      text-decoration: none; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3); 
    }

    .score-banner { 
      text-align: center; 
      padding: 16px 0 20px 0; 
      border-bottom: 2px dashed #E2E8F0; 
      margin-bottom: 16px; 
    }
    
    .score-badge { font-size: 2.6rem; font-weight: 800; color: var(--primary); }
    .target-met { font-size: 0.9rem; font-weight: 700; color: var(--correct); margin-top: 4px; }
    .target-missed { font-size: 0.9rem; font-weight: 700; color: #D97706; margin-top: 4px; }

    .review-card { 
      background: #FFFFFF; 
      border-left: 5px solid var(--primary); 
      padding: 12px 14px; 
      border-radius: 10px; 
      margin-bottom: 12px; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.04); 
      border-top: 1px solid #F1F5F9; 
      border-right: 1px solid #F1F5F9; 
      border-bottom: 1px solid #F1F5F9; 
    }
    
    .review-card.correct { border-left-color: var(--correct); }
    .review-card.incorrect { border-left-color: var(--incorrect); }
    .sinhala-review { 
      background: var(--sinhala-bg); 
      color: var(--sinhala-text); 
      padding: 8px 10px; 
      border-radius: 8px; 
      font-size: 0.82rem; 
      margin-top: 8px; 
      line-height: 1.45; 
    }
    
    .state-msg {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-weight: 500;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div>
    <div class="header">
      <div class="badge-row">
        <div class="badge subject-tag" id="subject-tag">Subject</div>
        <div class="badge day-tag" id="day-tag">Day 1</div>
        <div class="badge target-tag">Target: 65%+ (13+/20)</div>
      </div>
      <h1 id="title-text">Grade 6 Daily Booster</h1>
    </div>

    <!-- Dropdown Selector for Subject & Day -->
    <div class="selector-bar">
      <select class="select-dropdown" id="sel-subject">
        <option value="science">Science</option>
        <option value="geography">Geography</option>
        <option value="health">Health</option>
        <option value="civic">Civic</option>
      </select>
      <select class="select-dropdown" id="sel-day">
        <option value="1">Day 1</option>
        <option value="2">Day 2</option>
        <option value="3">Day 3</option>
        <option value="4">Day 4</option>
        <option value="5">Day 5</option>
      </select>
    </div>

    <!-- Quiz Question Screen -->
    <div id="screen-quiz">
      <div id="quiz-container">
        <div class="state-msg">Connecting to Google Sheets...</div>
      </div>
      <button class="btn-submit" id="submit-btn" type="button" style="display:none;">Submit Answers & View Review</button>
    </div>

    <!-- Assessment Result Screen -->
    <div id="screen-results" style="display:none;">
      <div class="score-banner">
        <div style="font-size: 0.85rem; color: var(--muted); font-weight: 600;">Daily Test Score</div>
        <div class="score-badge" id="score-text">0 / 20</div>
        <div id="target-feedback"></div>
      </div>
      <div id="review-container"></div>
      <button class="btn-whatsapp" id="whatsapp-btn" type="button">
        <span>📲</span> Send Detailed Report to Tutor via WhatsApp
      </button>
    </div>
  </div>
</div>

<script>
  // Deployed Google Apps Script Web App URL
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbRD74dpAEVZnL01OacoUmw8t0emDSp17ZGT_Q30b1GOTVX-RtZhc4IJS8jpLp03QhmQ/exec";
  var TARGET_PHONE = "94701543307";

  var currentSubject = 'science';
  var currentDay = '1';
  var userAnswers = {};
  var currentQuestions = [];

  function fetchQuestions() {
    var quizContainer = document.getElementById('quiz-container');
    var submitBtn = document.getElementById('submit-btn');
    var screenResults = document.getElementById('screen-results');
    var screenQuiz = document.getElementById('screen-quiz');
    
    screenResults.style.display = 'none';
    screenQuiz.style.display = 'block';
    quizContainer.innerHTML = '<div class="state-msg">Fetching questions from Google Sheets...</div>';
    submitBtn.style.display = 'none';

    var fetchUrl = APPS_SCRIPT_URL + '?subject=' + encodeURIComponent(currentSubject) + '&day=' + encodeURIComponent(currentDay);

    fetch(fetchUrl)
      .then(function(res) { 
        return res.json(); 
      })
      .then(function(data) {
        if (data.error) throw new Error(data.error);

        document.getElementById('subject-tag').innerText = currentSubject.toUpperCase();
        document.getElementById('day-tag').innerText = 'DAY ' + currentDay;
        document.getElementById('title-text').innerText = data.title || (currentSubject.toUpperCase() + ' (Day ' + currentDay + ')');
        
        currentQuestions = data.questions || [];
        userAnswers = {};

        if (currentQuestions.length === 0) {
          quizContainer.innerHTML = '<div class="state-msg">No questions found for ' + currentSubject.toUpperCase() + ' Day ' + currentDay + ' in the spreadsheet.</div>';
          return;
        }

        renderQuiz();
        submitBtn.style.display = 'block';
      })
      .catch(function(err) {
        quizContainer.innerHTML = '<div class="state-msg" style="color:var(--incorrect);">⚠️ ' + err.message + '</div>';
      });
  }

  function renderQuiz() {
    var container = document.getElementById('quiz-container');
    container.innerHTML = '';

    currentQuestions.forEach(function(q, idx) {
      var card = document.createElement('div');
      card.className = 'quiz-card';

      var qNum = document.createElement('div');
      qNum.className = 'q-number';
      qNum.textContent = 'Question ' + (idx + 1) + ' of ' + currentQuestions.length;
      card.appendChild(qNum);

      var qText = document.createElement('div');
      qText.className = 'q-text';
      qText.textContent = q.q;
      card.appendChild(qText);

      if (q.type === 'mcq') {
        var group = document.createElement('div');
        group.className = 'options-group';
        q.options.forEach(function(opt) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'option-btn';
          btn.setAttribute('data-qidx', idx);
          btn.setAttribute('data-val', opt);
          btn.textContent = opt;
          group.appendChild(btn);
        });
        card.appendChild(group);
      } else {
        var input = document.createElement('input');
        input.type = 'text';
        input.className = 'text-input';
        input.setAttribute('data-qidx', idx);
        input.placeholder = 'Type answer in English...';
        card.appendChild(input);
      }

      container.appendChild(card);
    });
  }

  function submitAnswers() {
    var score = 0;
    var reviewContainer = document.getElementById('review-container');
    reviewContainer.innerHTML = '';

    currentQuestions.forEach(function(q, idx) {
      var uAns = userAnswers[idx] || 'Not answered';
      var isCorrect = uAns.toString().trim().toLowerCase() === q.ans.toString().trim().toLowerCase();
      if (isCorrect) score++;

      var card = document.createElement('div');
      card.className = 'review-card ' + (isCorrect ? 'correct' : 'incorrect');

      var status = document.createElement('div');
      status.style.fontSize = '0.75rem';
      status.style.fontWeight = '800';
      status.style.color = isCorrect ? 'var(--correct)' : 'var(--incorrect)';
      status.textContent = isCorrect ? '✓ Correct' : '✗ Needs Practice';
      card.appendChild(status);

      var text = document.createElement('div');
      text.style.fontWeight = '600';
      text.style.fontSize = '0.88rem';
      text.style.margin = '4px 0';
      text.textContent = q.q;
      card.appendChild(text);

      var ansDetail = document.createElement('div');
      ansDetail.style.fontSize = '0.84rem';
      ansDetail.innerHTML = 'Your Answer: <b>' + uAns + '</b> | Correct Answer: <b style="color:var(--primary);">' + q.ans + '</b>';
      card.appendChild(ansDetail);

      var sinhalaBox = document.createElement('div');
      sinhalaBox.className = 'sinhala-review';
      sinhalaBox.innerHTML = '💡 <b>Study Tip:</b> ' + (q.sinhala || 'No tip provided.');
      card.appendChild(sinhalaBox);

      reviewContainer.appendChild(card);
    });

    var percentage = Math.round((score / currentQuestions.length) * 100);
    document.getElementById('score-text').innerText = score + ' / ' + currentQuestions.length + ' (' + percentage + '%)';
    
    var feedbackEl = document.getElementById('target-feedback');
    if (percentage >= 65) {
      feedbackEl.className = 'target-met';
      feedbackEl.innerText = '🎯 Target Passed (65%+)! Great job, keep it up!';
    } else {
      feedbackEl.className = 'target-missed';
      feedbackEl.innerText = '📖 You got below 65%. Read the study tips below to learn the words!';
    }

    document.getElementById('screen-quiz').style.display = 'none';
    document.getElementById('screen-results').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function shareWhatsAppDirect() {
    var wrongReport = [];
    var correctCount = 0;

    currentQuestions.forEach(function(q, idx) {
      var uAns = userAnswers[idx] || 'Not answered';
      var isCorrect = uAns.toString().trim().toLowerCase() === q.ans.toString().trim().toLowerCase();
      if (isCorrect) {
        correctCount++;
      } else {
        wrongReport.push("Q" + (idx + 1) + ": " + q.q + "\n  ❌ Her Answer: " + uAns + "\n  ✅ Correct: " + q.ans);
      }
    });

    var percentage = Math.round((correctCount / currentQuestions.length) * 100);
    var text = "📊 *Daily Practice Assessment Report*\n\n" +
               "📌 *Subject:* " + currentSubject.toUpperCase() + " (Day " + currentDay + ")\n" +
               "🎯 *Score:* " + correctCount + "/" + currentQuestions.length + " (" + percentage + "%)\n" +
               "🏆 *Target 65%+ Status:* " + (percentage >= 65 ? "MET ✅" : "NEEDS PRACTICE ⚠️") + "\n\n";

    if (wrongReport.length > 0) {
      text += "📝 *Mistakes & Insights:*\n" + wrongReport.join("\n\n") + "\n\n";
    } else {
      text += "🌟 *Outstanding:* 100% correct answers today!\n\n";
    }

    text += "She has reviewed the English terminology and Sinhala notes.";

    var waUrl = "https://api.whatsapp.com/send?phone=" + TARGET_PHONE + "&text=" + encodeURIComponent(text);
    window.location.href = waUrl;
  }

  function setupEventListeners() {
    document.getElementById('sel-subject').addEventListener('change', function(e) {
      currentSubject = e.target.value;
      fetchQuestions();
    });

    document.getElementById('sel-day').addEventListener('change', function(e) {
      currentDay = e.target.value;
      fetchQuestions();
    });

    var quizContainer = document.getElementById('quiz-container');
    quizContainer.addEventListener('click', function(e) {
      var btn = e.target.closest('.option-btn');
      if (!btn) return;
      var qIdx = parseInt(btn.getAttribute('data-qidx'), 10);
      userAnswers[qIdx] = btn.getAttribute('data-val');

      var group = btn.closest('.options-group');
      group.querySelectorAll('.option-btn').forEach(function(b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
    });

    quizContainer.addEventListener('input', function(e) {
      if (e.target.classList.contains('text-input')) {
        var qIdx = parseInt(e.target.getAttribute('data-qidx'), 10);
        userAnswers[qIdx] = e.target.value.trim();
      }
    });

    document.getElementById('submit-btn').addEventListener('click', submitAnswers);
    document.getElementById('whatsapp-btn').addEventListener('click', shareWhatsAppDirect);
  }

  document.addEventListener('DOMContentLoaded', function() {
    setupEventListeners();
    fetchQuestions();
  });
</script>
</body>
</html>
